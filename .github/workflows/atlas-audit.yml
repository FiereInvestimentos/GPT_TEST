name: ATLAS B3 Data Audit

on:
  push:
    branches: [main]
    paths:
      - audit_data.py
      - .github/workflows/atlas-audit.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow requests
      - name: Audit dataset
        run: python audit_data.py
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-b3-data-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
