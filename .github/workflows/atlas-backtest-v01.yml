name: ATLAS Direct-QP v0.1 Backtest

on:
  push:
    branches: [main]
    paths:
      - atlas_backtest_v01.py
      - atlas_backtest_v01_retry.py
      - atlas_config_v01.json
      - .github/workflows/atlas-backtest-v01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore annual B3 files cache
        uses: actions/cache@v4
        with:
          path: .cache/cotahist
          key: cotahist-b3-2017-2025-v1
          save-always: true
      - name: Install research dependencies
        run: python -m pip install --upgrade numpy pandas scipy matplotlib requests tabulate
      - name: Run frozen backtest
        run: python atlas_backtest_v01_retry.py
      - name: Upload complete research package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-direct-qp-v01-results
          path: atlas_results_v01/
          if-no-files-found: warn
          retention-days: 30
