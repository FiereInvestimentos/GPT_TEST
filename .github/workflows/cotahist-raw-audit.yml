name: Official B3 COTAHIST Raw Audit

on:
  push:
    branches: [main]
    paths:
      - audit_cotahist_raw.py
      - .github/workflows/cotahist-raw-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --upgrade requests
      - name: Audit official B3 annual files
        run: python audit_cotahist_raw.py
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-b3-cotahist-raw-audit
          path: artifacts_raw/
          if-no-files-found: error
          retention-days: 14
